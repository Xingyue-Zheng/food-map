<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>今天吃什么 · 浙大堕落街</title>
<style>
/* ═══════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════ */
:root{
  --brand:#FF5A1F;   --brand-d:#E2450F;  --brand-weak:#FFF1EA; --brand-line:#FFD8C6;
  --gold:#F59300;    --gold-weak:#FFF6E6;
  --green:#12A150;   --green-weak:#E8F6EE;

  --bg:#F5F6F7;  --surface:#FFFFFF;  --fill:#F2F3F5;  --fill-2:#E8EAED;
  --line:#ECEEF0; --line-2:#DDE0E4;
  --t1:#17181A;  --t2:#6B7078;  --t3:#9DA3AB;

  --r1:8px; --r2:12px; --r3:16px; --r4:20px; --r5:28px;
  --sh1:0 1px 2px rgba(16,18,20,.05);
  --sh2:0 4px 14px rgba(16,18,20,.07);
  --sh3:0 18px 44px rgba(16,18,20,.16);

  --nav-h:56px;
  --tab-h:58px;
  --safe-b:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
/* 全部走系统字体：不依赖 Google Fonts，国内打开不会因为字体请求超时而白屏 */
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','HarmonyOS Sans SC','Source Han Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--t1);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
::-webkit-scrollbar{width:0;height:0;}

/* ═══════════════════════════════════════
   PRIMITIVES — 全站复用
═══════════════════════════════════════ */
/* 单一 chip 体系：默认中性，只有评分/优惠带颜色 */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:var(--r1);
  font-size:12px;font-weight:500;
  background:var(--fill);color:var(--t2);white-space:nowrap;
}
.chip--rate{background:var(--gold-weak);color:#B26A00;font-weight:700;}
.chip--deal{background:var(--brand-weak);color:var(--brand-d);font-weight:700;}

/* 单一 tag（# 标签） */
.tag{
  display:inline-block;padding:2px 8px;border-radius:6px;
  background:var(--fill);color:var(--t3);font-size:11px;
}

/* 分段筛选器：全站统一，不再一个分类一个颜色 */
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.seg-item{
  flex-shrink:0;padding:7px 14px;border-radius:999px;
  font-size:13px;font-weight:500;color:var(--t2);
  background:var(--surface);border:1px solid var(--line-2);
  transition:background .15s,color .15s,border-color .15s;
}
.seg-item:hover{border-color:var(--t3);}
.seg-item.active{background:var(--t1);border-color:var(--t1);color:#fff;}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 20px;border-radius:var(--r2);
  font-size:14px;font-weight:700;
  transition:background .15s,transform .1s,box-shadow .15s;
}
.btn:active{transform:scale(.985);}
.btn--primary{background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(255,90,31,.28);}
.btn--primary:hover{background:var(--brand-d);}
.btn--ghost{background:var(--fill);color:var(--t1);}
.btn--ghost:hover{background:var(--fill-2);}
.btn--block{width:100%;}

.sec-label{font-size:12px;font-weight:700;color:var(--t3);letter-spacing:.06em;margin-bottom:12px;}

/* ═══════════════════════════════════════
   顶栏 — 只放品牌 + 逛吃分区，导航全部交给底栏
═══════════════════════════════════════ */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
/* 品牌字：优先用系统自带的楷体撑出手写感，装了 Ma Shan Zheng 的机器会更好看，
   都没有就退回衬线体 —— 任何一档都不会退化成 Comic Sans 那种 cursive 默认 */
.logo{
  display:flex;align-items:center;gap:8px;
  font-family:'Ma Shan Zheng','STKaiti','KaiTi','楷体',serif;
  font-size:22px;font-weight:400;letter-spacing:.02em;color:var(--t1);
}
.logo-b{
  width:30px;height:30px;border-radius:9px;background:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.campus-sel{
  appearance:none;-webkit-appearance:none;
  padding:7px 30px 7px 12px;border-radius:999px;
  border:1px solid var(--line-2);background-color:var(--surface);
  font-size:13px;font-weight:500;color:var(--t1);cursor:pointer;outline:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%236B7078' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;
}
.campus-sel:focus{border-color:var(--brand);}

/* ═══════════════════════════════════════
   VIEWS
═══════════════════════════════════════ */
.view{display:none;position:fixed;inset:var(--nav-h) 0 0 0;background:var(--bg);}
.view.active{display:block;}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px calc(var(--tab-h) + var(--safe-b) + 24px);}
.wrap--wide{max-width:1120px;}

/* ═══════════════════════════════════════
   翻牌 — flex 排版，操作按钮不再被底栏压住
═══════════════════════════════════════ */
.swipe-arena{
  height:100%;display:flex;flex-direction:column;align-items:center;
  padding:10px 16px calc(var(--tab-h) + var(--safe-b) + 12px);
}
.swipe-hint{
  display:flex;align-items:center;gap:14px;
  font-size:12px;color:var(--t3);margin-bottom:10px;flex-shrink:0;
}
.swipe-hint b{color:var(--t2);font-weight:500;}
.card-stack{position:relative;width:100%;max-width:360px;flex:1;min-height:0;}

.food-card{
  position:absolute;inset:0;
  background:var(--surface);border-radius:var(--r5);overflow:hidden;
  box-shadow:var(--sh3);
  display:flex;flex-direction:column;
  cursor:grab;user-select:none;touch-action:none;will-change:transform;
}
.food-card:active{cursor:grabbing;}
.food-card.is-top{z-index:10;}
.food-card.is-second{z-index:9;transform:scale(.955) translateY(14px);filter:saturate(.9);}
.food-card.is-third{z-index:8;transform:scale(.91) translateY(26px);filter:saturate(.8);}

/* 视觉区：底色 + 同款 emoji 铺成纹理 + 主体大图，不再是孤零零一个贴纸 */
.card-visual{
  position:relative;flex:1;min-height:0;overflow:hidden;
  background:var(--cv,#FFF1EA);
}
.card-visual::after{
  content:'';position:absolute;inset:0;z-index:1;
  background:radial-gradient(120% 82% at 50% 10%,rgba(255,255,255,.72),transparent 62%);
}
.cv-pat{position:absolute;inset:0;overflow:hidden;}
.cv-pat span{position:absolute;font-size:34px;opacity:.15;line-height:1;}
.cv-main{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(84px,25vw,120px);line-height:1;z-index:2;
  filter:drop-shadow(0 12px 18px rgba(80,40,10,.18));
}
.cv-badges{position:absolute;top:14px;left:14px;display:flex;gap:6px;z-index:3;}
.cv-badge{
  padding:4px 9px;border-radius:7px;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.92);color:var(--t1);box-shadow:var(--sh1);
}
.cv-badge--hot{background:var(--brand);color:#fff;}

/* 信息区：白底，层级靠字号字重而不是颜色 */
.card-body{flex-shrink:0;padding:16px 18px 18px;background:var(--surface);}
.cb-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;}
.cb-name{font-size:19px;font-weight:700;line-height:1.25;}
.cb-rate{display:flex;align-items:baseline;gap:3px;flex-shrink:0;color:var(--gold);}
.cb-rate b{font-size:17px;font-weight:700;}
.cb-rate span{font-size:11px;color:var(--t3);}
.cb-meta{font-size:13px;color:var(--t2);margin-bottom:10px;}
.cb-meta i{font-style:normal;color:var(--line-2);margin:0 7px;}
.cb-meta b{color:var(--t1);font-weight:700;}
.cb-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

/* 滑动反馈 */
.vote-overlay{
  position:absolute;inset:0;z-index:20;border-radius:var(--r5);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .1s;pointer-events:none;
}
.vote-yes{background:rgba(18,161,80,.2);}
.vote-no{background:rgba(107,112,120,.22);}
.vote-label{
  padding:10px 22px;border-radius:var(--r2);
  font-size:26px;font-weight:700;letter-spacing:.06em;
  background:#fff;box-shadow:var(--sh2);transform:rotate(-8deg);
}
.vote-yes .vote-label{color:var(--green);}
.vote-no .vote-label{color:var(--t2);transform:rotate(8deg);}

/* 操作区：在正常流里，永远压不到 */
.swipe-btns{display:flex;gap:18px;align-items:center;justify-content:center;padding-top:16px;flex-shrink:0;}
.swipe-btn{
  width:56px;height:56px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  background:var(--surface);box-shadow:var(--sh2);
  transition:transform .15s,box-shadow .15s;
}
.swipe-btn:hover{transform:translateY(-2px);box-shadow:var(--sh3);}
.swipe-btn:active{transform:scale(.94);}
.btn-pass{color:var(--t2);}
.btn-like{background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(255,90,31,.34);}
.btn-undo{width:44px;height:44px;font-size:17px;color:var(--t3);}

.swipe-empty{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;text-align:center;
}
.swipe-empty .ei{font-size:60px;}
.swipe-empty h3{font-size:19px;font-weight:700;}
.swipe-empty p{font-size:13px;color:var(--t2);margin-bottom:8px;}

/* ═══════════════════════════════════════
   配对弹窗
═══════════════════════════════════════ */
.match-popup{
  position:fixed;inset:0;z-index:200;padding:24px;
  background:rgba(16,18,20,.55);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
}
.match-popup.open{display:flex;}
.match-card{
  background:var(--surface);border-radius:var(--r5);overflow:hidden;
  width:min(380px,100%);box-shadow:var(--sh3);
  animation:pop .35s cubic-bezier(.34,1.4,.64,1);
}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(10px)}to{opacity:1;transform:none}}
.match-hero{height:170px;display:flex;align-items:center;justify-content:center;font-size:78px;position:relative;overflow:hidden;}
.match-hero>span{position:relative;z-index:2;filter:drop-shadow(0 10px 14px rgba(80,40,10,.16));}
.match-confetti{position:absolute;inset:0;pointer-events:none;z-index:3;}
.confetti-dot{position:absolute;width:7px;height:7px;border-radius:50%;animation:fall 1.4s ease-in both;}
@keyframes fall{from{transform:translateY(-24px) rotate(0);opacity:1}to{transform:translateY(190px) rotate(320deg);opacity:0}}
.match-body{padding:20px;}
.match-wow{font-size:13px;font-weight:700;color:var(--brand);margin-bottom:6px;}
.match-name{font-size:21px;font-weight:700;margin-bottom:16px;}
.match-details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.mdet{background:var(--fill);border-radius:var(--r2);padding:11px 12px;}
.mdet-val{font-size:16px;font-weight:700;margin-bottom:2px;}
.mdet-lbl{font-size:11px;color:var(--t3);}
.match-btns{display:flex;gap:8px;}
.match-btns .btn{flex:1;}

/* ═══════════════════════════════════════
   帮我选
═══════════════════════════════════════ */
.hero-head{padding:8px 0 22px;}
.hero-head h1{font-size:28px;font-weight:700;line-height:1.3;margin-bottom:6px;letter-spacing:-.01em;}
.hero-head h1 em{font-style:normal;color:var(--brand);}
.hero-head p{font-size:13px;color:var(--t2);}
.panel{background:var(--surface);border-radius:var(--r4);border:1px solid var(--line);box-shadow:var(--sh1);padding:20px;margin-bottom:16px;}
.mood-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;}
.mood-card{
  padding:12px 6px;text-align:center;border-radius:var(--r2);
  background:var(--fill);border:1.5px solid transparent;
  transition:background .15s,border-color .15s;cursor:pointer;
}
.mood-card:hover{background:var(--fill-2);}
.mood-card.sel{background:var(--brand-weak);border-color:var(--brand);}
.mi{font-size:24px;line-height:1;margin-bottom:6px;}
.ml{font-size:12px;font-weight:700;}
.ms{font-size:10px;color:var(--t3);margin-top:2px;}
.budget-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.blabel{font-size:13px;color:var(--t2);white-space:nowrap;}
.bpills{display:flex;gap:6px;flex-wrap:wrap;}
.bpill{
  padding:7px 13px;border-radius:999px;font-size:12px;font-weight:500;
  background:var(--fill);color:var(--t2);border:1.5px solid transparent;transition:all .15s;
}
.bpill.active{background:var(--brand-weak);border-color:var(--brand);color:var(--brand-d);font-weight:700;}
.big-btn{padding:15px;font-size:15px;letter-spacing:.04em;}
.spin-ico{animation:spin 2.4s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}

.result-card{
  background:var(--surface);border-radius:var(--r4);overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--sh2);
  animation:pop .35s cubic-bezier(.34,1.4,.64,1);
}
.res-hero{height:150px;display:flex;align-items:center;justify-content:center;font-size:72px;position:relative;overflow:hidden;}
.res-hero>span{position:relative;z-index:2;filter:drop-shadow(0 10px 14px rgba(80,40,10,.16));}
.winner-b{
  position:absolute;top:12px;left:12px;z-index:3;
  background:var(--brand);color:#fff;padding:4px 10px;border-radius:7px;font-size:11px;font-weight:700;
}
.res-body{padding:18px;}
.res-name{font-size:20px;font-weight:700;margin-bottom:10px;}
.res-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.res-reason{
  background:var(--brand-weak);border-radius:var(--r2);
  padding:12px 14px;font-size:13px;color:var(--brand-d);line-height:1.6;margin-bottom:16px;
}
.res-reason small{display:block;margin-top:6px;font-size:11px;color:var(--t2);}
.res-btns{display:flex;gap:8px;}
.res-btns .btn{flex:1;padding:11px;font-size:13px;}
.ldots{display:flex;justify-content:center;gap:7px;padding:28px;}
.ldots span{width:8px;height:8px;border-radius:50%;background:var(--brand);opacity:.35;animation:db 1.2s ease-in-out infinite;}
.ldots span:nth-child(2){animation-delay:.16s}
.ldots span:nth-child(3){animation-delay:.32s}
@keyframes db{0%,80%,100%{transform:scale(.7);opacity:.3}40%{transform:scale(1);opacity:1}}

/* ═══════════════════════════════════════
   热搜榜
═══════════════════════════════════════ */
.hot-header{
  background:linear-gradient(135deg,#FF7A3D,#FF5A1F);
  border-radius:var(--r4);padding:22px;margin-bottom:20px;color:#fff;position:relative;overflow:hidden;
}
.hot-header::before{
  content:'';position:absolute;top:-40px;right:-30px;width:150px;height:150px;
  border-radius:50%;background:rgba(255,255,255,.12);
}
.hot-header h2{font-size:22px;font-weight:700;margin-bottom:5px;position:relative;}
.hot-header p{font-size:13px;opacity:.85;position:relative;}
.hot-update{
  display:inline-flex;align-items:center;gap:6px;position:relative;
  background:rgba(255,255,255,.2);padding:4px 11px;border-radius:999px;
  font-size:11px;font-weight:500;margin-top:12px;
}
.live-dot{width:6px;height:6px;background:#fff;border-radius:50%;animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.topic-section{margin-bottom:22px;}
.topic-cloud{display:flex;flex-wrap:wrap;gap:8px;}
.topic-tag{
  padding:7px 13px;border-radius:var(--r1);font-size:12px;font-weight:500;
  background:var(--surface);border:1px solid var(--line-2);color:var(--t2);
  transition:all .15s;
}
.topic-tag:hover{border-color:var(--brand);color:var(--brand-d);background:var(--brand-weak);}

.hot-cats{margin-bottom:16px;}
.hot-list{display:flex;flex-direction:column;gap:10px;}
.hot-item{
  background:var(--surface);border-radius:var(--r3);padding:14px 16px;
  display:flex;align-items:center;gap:14px;cursor:pointer;
  border:1px solid var(--line);box-shadow:var(--sh1);
  transition:box-shadow .18s,transform .18s;
}
.hot-item:hover{box-shadow:var(--sh2);transform:translateY(-1px);}
.rank{width:26px;flex-shrink:0;text-align:center;}
.rank-num{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--t3);}
.rank-num.top{color:var(--brand);}
.rank-arrow{font-size:9px;line-height:1;margin-top:3px;}
.arr-up{color:var(--brand);}
.arr-dn{color:var(--t3);}
.arr-st{color:var(--line-2);}
.hot-emoji{
  width:44px;height:44px;flex-shrink:0;border-radius:var(--r2);
  display:flex;align-items:center;justify-content:center;font-size:24px;
}
.hot-info{flex:1;min-width:0;}
.hot-name{font-size:15px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hot-label{
  display:inline-block;max-width:100%;
  padding:2px 8px;border-radius:5px;margin-bottom:5px;
  font-size:11px;font-weight:500;
  background:var(--brand-weak);color:var(--brand-d);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hot-sub{font-size:12px;color:var(--t3);display:flex;gap:10px;flex-wrap:wrap;}
.hot-sub b{color:var(--brand-d);font-weight:500;}
.hot-right{text-align:right;flex-shrink:0;}
.hot-score{font-size:17px;font-weight:700;color:var(--gold);line-height:1.1;}
.hot-heat{font-size:11px;color:var(--t3);margin:3px 0 4px;}
.trending-bar{width:52px;height:3px;background:var(--fill-2);border-radius:2px;overflow:hidden;margin-left:auto;}
.trending-fill{height:100%;background:var(--brand);border-radius:2px;}

/* ═══════════════════════════════════════
   探索
═══════════════════════════════════════ */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
.sec-title{font-size:20px;font-weight:700;}
.sec-count{font-size:12px;color:var(--t3);}
.search-row{display:flex;gap:8px;margin-bottom:14px;}
.si-wrap{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:999px;
  padding:9px 16px;transition:border-color .15s;
}
.si-wrap:focus-within{border-color:var(--brand);}
.si-wrap input{flex:1;border:none;outline:none;background:transparent;font-size:14px;min-width:0;}
.si-wrap input::placeholder{color:var(--t3);}
.sort-sel{
  appearance:none;-webkit-appearance:none;
  padding:9px 30px 9px 14px;border-radius:999px;
  border:1px solid var(--line-2);background-color:var(--surface);
  font-size:13px;color:var(--t2);cursor:pointer;outline:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%236B7078' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;
}
.filter-row{margin-bottom:16px;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.rcard{
  background:var(--surface);border-radius:var(--r3);overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--sh1);cursor:pointer;
  transition:box-shadow .18s,transform .18s;

function initSwipe(){
  swipeDeck=byCampus(D).slice().sort(()=>Math.random()-.5);
  swipeHistory=[];

}

function renderSwipeStack(){
  const stack=document.getElementById('cardStack');
  // Remove empty state if present
  const empty=document.getElementById('swipeEmpty');
  if(empty)empty.remove();

  if(swipeDeck.length===0){
    stack.innerHTML=`<div class="swipe-empty" id="swipeEmpty">
      <div class="ei">😋</div>
      <h3>全部看完啦</h3>
      <p>你的食欲已经被摸透</p>
      <button class="btn btn--primary" onclick="initSwipe()">再来一轮</button>
    </div>`;
    return;
  }

  const visible=swipeDeck.slice(0,3);
  stack.innerHTML=visible.map((r,i)=>{
    const cls=i===0?'is-top':i===1?'is-second':'is-third';
    const badges=[];
    if(r.bd.includes('hot'))badges.push('<span class="cv-badge cv-badge--hot">热门</span>');
    if(r.bd.includes('new'))badges.push('<span class="cv-badge">新店</span>');
    return`<div class="food-card ${cls}" id="card-${r.id}" data-id="${r.id}">
      <div class="card-visual" style="--cv:${cv(r)}">
        ${pat(r.e)}
        <div class="cv-main">${r.e}</div>
        ${badges.length?`<div class="cv-badges">${badges.join('')}</div>`:''}
      </div>
      <div class="card-body">
        <div class="cb-head">
          <div class="cb-name">${r.nm}</div>
          <div class="cb-rate"><b>${r.r}</b><span>(${r.rv})</span></div>
        </div>
        <div class="cb-meta"><b>${r.pLb}</b><i>|</i>步行 ${r.w} 分钟<i>|</i>${r.cn}</div>
        <div class="cb-row">
          ${r.hd?`<span class="chip chip--deal">${r.dl}</span>`:''}
          ${r.tgs.map(t=>`<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
      <div class="vote-overlay vote-yes"><span class="vote-label">想吃</span></div>
      <div class="vote-overlay vote-no"><span class="vote-label">没感觉</span></div>
    </div>`;
  }).join('');

  attachSwipeEvents();
}

function attachSwipeEvents(){
  detachEvents(); // 否则每次重绘都会再挂一组 document 监听，越滑越多
  const card=document.querySelector('.food-card.is-top');
  if(!card){currentCard=null;return;}
  currentCard=card;

  card.addEventListener('mousedown',dragStart);
  card.addEventListener('touchstart',dragStart,{passive:true});
  document.addEventListener('mousemove',dragMove);
  document.addEventListener('touchmove',dragMove,{passive:true});
  document.addEventListener('mouseup',dragEnd);
  document.addEventListener('touchend',dragEnd);
}

function detachEvents(){
  document.removeEventListener('mousemove',dragMove);
  document.removeEventListener('touchmove',dragMove);
  document.removeEventListener('mouseup',dragEnd);
  document.removeEventListener('touchend',dragEnd);
}

function getX(e){return e.touches?e.touches[0].clientX:e.clientX;}
function getY(e){return e.touches?e.touches[0].clientY:e.clientY;}

function dragStart(e){
  isDragging=true;
  startX=getX(e);startY=getY(e);
  if(currentCard)currentCard.style.transition='none';
}

function dragMove(e){
  if(!isDragging||!currentCard)return;
  const dx=getX(e)-startX;
  const dy=getY(e)-startY;
  const rot=dx*0.12;
  currentCard.style.transform=`translateX(${dx}px) translateY(${dy*.3}px) rotate(${rot}deg)`;
  const pct=Math.min(Math.abs(dx)/120,1);
  const yesOv=currentCard.querySelector('.vote-yes');
  const noOv=currentCard.querySelector('.vote-no');
  if(dx>0){yesOv.style.opacity=pct;noOv.style.opacity=0;}
  else{noOv.style.opacity=pct;yesOv.style.opacity=0;}
}

function dragEnd(e){
  if(!isDragging||!currentCard)return;
  isDragging=false;
  const dx=getX(e)-startX;
  detachEvents();
  if(Math.abs(dx)>80){
    flyOut(dx>0?'right':'left');
  } else {
    currentCard.style.transition='transform .35s cubic-bezier(.34,1.56,.64,1)';
    currentCard.style.transform='';
    currentCard.querySelector('.vote-yes').style.opacity=0;
    currentCard.querySelector('.vote-no').style.opacity=0;
    setTimeout(attachSwipeEvents,350);
  }
}

function flyOut(dir){
  if(!currentCard)return;
  const id=parseInt(currentCard.dataset.id);
  const r=D.find(x=>x.id===id);
  currentCard.style.transition='transform .45s ease, opacity .45s ease';
  const fly=dir==='right'?'translateX(140%) rotate(30deg)':'translateX(-140%) rotate(-30deg)';
  currentCard.style.transform=fly;
  currentCard.style.opacity='0';
  if(dir==='right'){
    swipeHistory.push({r,card:currentCard});
    showMatch(r);
  } else {
    swipeHistory.push({r,card:currentCard});
  }
  swipeDeck=swipeDeck.filter(x=>x.id!==id);
  setTimeout(()=>{renderSwipeStack();},420);
}

function doSwipe(dir){flyOut(dir);}

function undoSwipe(){
  if(swipeHistory.length===0){toast('没有可以撤回的了 😅');return;}
  const last=swipeHistory.pop();
  swipeDeck.unshift(last.r);
  renderSwipeStack();
  toast('↩ 已撤回');
}

function showMatch(r){
  const colors=['#FF5A1F','#F59300','#12A150','#FF7A3D','#FFB07A'];
  const conf=Array.from({length:18},(_,i)=>{
    const c=colors[i%colors.length],l=Math.random()*100,d=Math.random()*.7,s=5+Math.random()*5;
    return`<div class="confetti-dot" style="left:${l}%;background:${c};animation-delay:${d}s;width:${s}px;height:${s}px;border-radius:${Math.random()>.5?'50%':'2px'}"></div>`;
  }).join('');
  const hero=document.getElementById('matchHero');
  hero.style.background=cv(r);
  hero.innerHTML=`${pat(r.e)}<span>${r.e}</span><div class="match-confetti">${conf}</div>`;
  document.getElementById('matchName').textContent=r.nm;
  document.getElementById('matchDetails').innerHTML=`
    <div class="mdet"><div class="mdet-val">${r.pLb}</div><div class="mdet-lbl">人均价格</div></div>
    <div class="mdet"><div class="mdet-val">${r.w} 分钟</div><div class="mdet-lbl">步行距离</div></div>
    <div class="mdet"><div class="mdet-val">${r.r}</div><div class="mdet-lbl">学生评分</div></div>
    <div class="mdet"><div class="mdet-val">${r.hr.split('–')[0]}</div><div class="mdet-lbl">开门时间</div></div>
  `;
  document.getElementById('matchPopup').classList.add('open');
}

function closeMatch(){document.getElementById('matchPopup').classList.remove('open');}

function renderHot(){
  let list=byCampus(D);
  if(hotCatFilter!=='all')list=list.filter(r=>r.ct===hotCatFilter);
  list=list.slice().sort((a,b)=>b.heat-a.heat);
  const el=document.getElementById('hotList');
  if(!list.length){el.innerHTML='<div class="empty-grid">这一段街上暂时没有这一类 🥲</div>';return;}
  const maxHeat=list[0].heat||1;
  el.innerHTML=list.map((r,i)=>{
    const rank=i+1;
    const arr=r.trend==='up'?'<div class="rank-arrow arr-up">▲</div>':r.trend==='dn'?'<div class="rank-arrow arr-dn">▼</div>':'<div class="rank-arrow arr-st">—</div>';
    const heatPct=Math.round(r.heat/maxHeat*100);
    const heatFmt=r.heat>=10000?`${(r.heat/10000).toFixed(1)}万`:`${(r.heat/1000).toFixed(1)}k`;
    return`<div class="hot-item" onclick="od(${r.id})">
      <div class="rank"><div class="rank-num${rank<=3?' top':''}">${rank}</div>${arr}</div>
      <div class="hot-emoji" style="background:${cv(r)}">${r.e}</div>
      <div class="hot-info">
        <div class="hot-name">${r.nm}</div>
        <div class="hot-label">${r.hotLabel.text}</div>
        <div class="hot-sub">
          <span>步行 ${r.w} 分钟</span>
          <span>${r.pLb}</span>
          ${r.hd?`<b>${r.dl}</b>`:''}
        </div>
      </div>
      <div class="hot-right">
        <div class="hot-score">${r.r}</div>
        <div class="hot-heat">${heatFmt} 热度</div>
        <div class="trending-bar"><div class="trending-fill" style="width:${heatPct}%"></div></div>
      </div>
    </div>`;
  }).join('');
}

      <div class="res-meta">
        <span class="chip chip--rate">★ ${r.r}</span>
        <span class="chip">${r.pLb}</span>
        <span class="chip">步行 ${r.w} 分钟</span>
        ${r.hd?`<span class="chip chip--deal">${r.dl}</span>`:''}
      </div>
      <div class="res-reason">${reason}<small>${r.cn} · ${r.hr}</small></div>
      <div class="res-btns">
        <button class="btn btn--ghost" onclick="od(${r.id})">查看详情</button>
        <button class="btn btn--ghost" onclick="getRec()">再来一个</button>
        <button class="btn btn--primary" onclick="toast('导航已启动')">出发</button>
      </div>
    </div>
  </div>`;
}

/* ══════════ EXPLORE ══════════ */
function re(){
  let list=byCampus(D).slice();
  if(filt.cat!=='all')list=list.filter(r=>r.ct===filt.cat);
  if(filt.search){
    const q=filt.search.trim().toLowerCase();
    list=list.filter(r=>(r.nm+r.tgs.join()+r.cn+r.mn.map(m=>m.n).join()).toLowerCase().includes(q));
  }
  if(filt.sort==='rating')list.sort((a,b)=>b.r-a.r);
  else if(filt.sort==='price_asc')list.sort((a,b)=>a.pN-b.pN);
  else if(filt.sort==='dist')list.sort((a,b)=>a.w-b.w);
  else list.sort((a,b)=>b.heat-a.heat);
  document.getElementById('expCount').textContent=list.length+' 家';
  document.getElementById('expGrid').innerHTML=list.map(ch).join('')||'<div class="empty-grid">没有找到符合条件的餐厅 🥲</div>';
}
function fc(el){document.querySelectorAll('#catFilter .seg-item').forEach(c=>c.classList.remove('active'));el.classList.add('active');filt.cat=el.dataset.cat;re();}
function hs(v){filt.search=v;re();}
function hso(v){filt.sort=v;re();}
function ch(r){
  const bl={hot:'热门',new:'新店',deal:'优惠',student:'学生价'};
  return`<div class="rcard" onclick="od(${r.id})">
    <div class="rc-img" style="background:${cv(r)}">${pat(r.e)}<span>${r.e}</span>
      <div class="rc-badges">${r.bd.map(b=>`<span class="rbadge${b==='hot'?' rb-h':''}">${bl[b]}</span>`).join('')}</div>
      <button class="ftog" onclick="tf(${r.id},this,event)" aria-label="收藏">${favs.has(r.id)?'❤️':'🤍'}</button>
    </div>
    <div class="rc-body">
      <div class="rc-name">${r.nm}<span class="rc-score">★ ${r.r}</span></div>
      <div class="rc-tags">${r.tgs.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="rc-info"><span>${r.pLb}</span><span>步行 ${r.w} 分钟</span><span>${r.rv} 条评价</span></div>
      ${r.hd?`<div class="rc-deal">${r.dl}</div>`:''}
      <div class="rc-foot"><span class="rcampus">${r.cn}</span>
        <div class="rc-btns">
          <button class="rbtn" onclick="event.stopPropagation();toast('导航已启动')">导航</button>
          <button class="rbtn rbtn-p" onclick="event.stopPropagation();od(${r.id})">详情</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ══════════ FAV ══════════ */
function tf(id,btn,ev){
  ev.stopPropagation();
  if(favs.has(id)){favs.delete(id);btn.textContent='🤍';toast('已取消收藏');}
  else{favs.add(id);btn.textContent='❤️';toast('已加入收藏 ❤️');}
}

/* ══════════ DRAWER ══════════ */
function od(id){
  const r=D.find(x=>x.id===id);
  const hero=document.getElementById('drhero');
  hero.style.background=cv(r);
  hero.innerHTML=`${pat(r.e)}<span>${r.e}</span>`;
  document.getElementById('drbody').innerHTML=`
    <div class="drtitle">${r.nm}</div>
    <div class="drchips">
      <span class="chip chip--rate">★ ${r.r}（${r.rv} 条评价）</span>
      <span class="chip">${r.pLb}</span>
      <span class="chip">步行 ${r.w} 分钟</span>
      <span class="chip">${r.hr}</span>
    </div>
    <div class="hot-label">${r.hotLabel.text}</div>
    ${r.hd?`<div class="dr-deal">今日学生专属：${r.dl}（凭学生证）</div>`:'<div style="height:6px"></div>'}
    <div class="drsec"><h4>热门菜品</h4>
      ${r.mn.map(m=>`<div class="mrow"><span class="memoji">${m.e}</span><div class="minfo"><div class="mname">${m.n}</div><div class="mdesc">${m.d}</div></div><div class="mprice">${m.p}</div></div>`).join('')}
    </div>
    <div class="drsec"><h4>同学评价</h4>
      ${r.rs.map(rv=>`<div class="rev-item"><div class="rev-head"><div class="rev-av">${rv.nm[0]}</div><div><div class="rev-nm">${rv.nm}</div><div class="rev-sc">${rv.sc}</div></div></div><div class="rev-tx">${rv.tx}</div></div>`).join('')}
    </div>`;
  document.getElementById('overlay').classList.add('open');
}
function cd(e){if(!e||e.target===document.getElementById('overlay'))document.getElementById('overlay').classList.remove('open');}

/* ══════════ TOAST ══════════ */
let tt;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2600);
}

/* ══════════ 分区切换 ══════════ */
/* 原来这个下拉框只调 re()，而 re() 又没读 cp 字段，等于完全没接线 */
function onCampus(){
  const sel=document.getElementById('campusSel');
  campus=sel.value;
  refreshCounts();
  initSwipe();
  renderHot();
  re();
  toast(campus==='all'?'已切换到整条堕落街':`已切换到${sel.options[sel.selectedIndex].text}`);
}
function refreshCounts(){
  const n=byCampus(D).length;
  document.getElementById('homeCount').textContent=n;
  document.getElementById('expCount').textContent=n+' 家';
}

/* ══════════ INIT ══════════ */
refreshCounts();
initSwipe();
renderHot();
re();
</script>
</body>
</html>
