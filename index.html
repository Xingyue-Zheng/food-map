<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么 · 大学城美食地图</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#FF6B6B;--peach:#FFA07A;--yellow:#FFD93D;--mint:#6BCB77;
  --sky:#4D96FF;--lav:#C77DFF;--cream:#FFF9F0;--ink:#1E1E1E;
  --muted:#888;--border:rgba(0,0,0,0.08);
  --s0:0 2px 12px rgba(0,0,0,.08);--s1:0 8px 32px rgba(0,0,0,.12);--s2:0 24px 64px rgba(0,0,0,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans SC',sans-serif;background:#1A1A1A;color:var(--ink);}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(20,20,20,.92);backdrop-filter:blur(20px);
  height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  border-bottom:1px solid rgba(255,255,255,.08);}
.logo{display:flex;align-items:center;gap:9px;font-family:'Ma Shan Zheng',cursive;font-size:20px;color:#fff;}
.logo-b{width:36px;height:36px;background:linear-gradient(135deg,var(--coral),var(--peach));
  border-radius:50% 40% 60% 30%/60% 50% 40% 50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;animation:bwob 4s ease-in-out infinite;}
@keyframes bwob{0%,100%{border-radius:50% 40% 60% 30%/60% 50% 40% 50%;}
  33%{border-radius:40% 60% 30% 70%/50% 60% 40% 50%;}
  66%{border-radius:60% 30% 70% 40%/40% 50% 60% 50%;}}
.nav-tabs{display:flex;gap:2px;background:rgba(255,255,255,.08);padding:4px;border-radius:28px;}
.ntab{padding:6px 16px;border-radius:22px;border:none;background:transparent;
  font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;color:rgba(255,255,255,.55);
  transition:all .2s;white-space:nowrap;}
.ntab.active{background:#fff;color:var(--ink);}
.campus-sel{padding:7px 14px;border-radius:28px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);font-size:12px;font-family:inherit;color:#fff;
  cursor:pointer;outline:none;}
.campus-sel option{background:#222;color:#fff;}

/* ── VIEWS ── */
.view{display:none;position:fixed;inset:0;top:60px;overflow:hidden;}
.view.active{display:block;}

/* ════════════════════════════
   SWIPE VIEW — 食欲翻牌
════════════════════════════ */
#view-swipe{background:#111;}
.swipe-arena{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px 16px 80px;
}
.swipe-hint{
  color:rgba(255,255,255,.35);font-size:12px;letter-spacing:.04em;
  margin-bottom:16px;display:flex;gap:24px;align-items:center;
}
.swipe-hint span{display:flex;align-items:center;gap:5px;}

/* Card stack */
.card-stack{position:relative;width:min(380px,94vw);height:min(560px,70vh);}
.food-card{
  position:absolute;inset:0;border-radius:28px;overflow:hidden;
  cursor:grab;user-select:none;touch-action:none;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
  transition:box-shadow .2s;will-change:transform;
}
.food-card:active{cursor:grabbing;}
.food-card.is-top{z-index:10;}
.food-card.is-second{z-index:9;transform:scale(.95) translateY(16px);}
.food-card.is-third{z-index:8;transform:scale(.90) translateY(30px);}

/* Beautiful gradient food backgrounds */
.card-bg{
  width:100%;height:100%;position:relative;
  display:flex;align-items:flex-end;
}
.card-food-emoji{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(100px,20vw,160px);
  filter:drop-shadow(0 8px 24px rgba(0,0,0,.4));
  z-index:1;
}
.card-noise{
  position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  z-index:2;pointer-events:none;opacity:.4;
}
.card-gradient{
  position:absolute;inset:0;z-index:3;
  background:linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,.3) 45%, transparent 70%);
}
.card-info{
  position:relative;z-index:4;padding:24px 24px 28px;width:100%;
}
.card-restaurant{font-size:22px;font-weight:700;color:#fff;margin-bottom:8px;line-height:1.2;}
.card-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.cchip{
  padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);
}
.cc-w{background:rgba(255,255,255,.15);color:#fff;}
.cc-g{background:rgba(107,203,119,.3);color:#a8f5b0;}
.cc-y{background:rgba(255,217,61,.25);color:#ffe566;}
.cc-r{background:rgba(255,107,107,.25);color:#ff9090;}
.card-tags-row{display:flex;gap:6px;flex-wrap:wrap;}
.ctag{font-size:11px;color:rgba(255,255,255,.5);}

/* Vote overlays */
.vote-overlay{
  position:absolute;inset:0;z-index:20;
  border-radius:28px;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .1s;pointer-events:none;
}
.vote-yes{background:linear-gradient(135deg,rgba(107,203,119,.6),rgba(77,200,100,.3));}
.vote-no{background:linear-gradient(135deg,rgba(255,107,107,.6),rgba(200,50,50,.3));}
.vote-label{
  font-family:'Ma Shan Zheng',cursive;font-size:52px;color:#fff;
  border:4px solid #fff;border-radius:16px;padding:8px 20px;
  transform:rotate(-12deg);
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));
}
.vote-no .vote-label{transform:rotate(12deg);}

/* Action buttons */
.swipe-btns{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;gap:20px;align-items:center;z-index:20;
}
.swipe-btn{
  width:60px;height:60px;border-radius:50%;border:none;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;cursor:pointer;transition:all .2s;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.swipe-btn:hover{transform:scale(1.1);}
.swipe-btn:active{transform:scale(.95);}
.btn-pass{background:rgba(255,80,80,.15);border:2px solid rgba(255,80,80,.5);color:#ff6b6b;}
.btn-pass:hover{background:rgba(255,80,80,.25);}
.btn-like{background:linear-gradient(135deg,#6BCB77,#4CAF50);color:#fff;}
.btn-undo{width:44px;height:44px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);font-size:18px;}

/* Match popup */
.match-popup{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.8);backdrop-filter:blur(12px);
  display:none;align-items:center;justify-content:center;padding:24px;
}
.match-popup.open{display:flex;}
.match-card{
  background:#fff;border-radius:28px;overflow:hidden;
  width:min(400px,92vw);animation:matchPop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes matchPop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.match-hero{height:200px;display:flex;align-items:center;justify-content:center;font-size:90px;position:relative;}
.match-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.confetti-dot{position:absolute;width:8px;height:8px;border-radius:50%;animation:confettiFall 1.5s ease-in both;}
@keyframes confettiFall{from{transform:translateY(-20px) rotate(0);opacity:1;}to{transform:translateY(200px) rotate(360deg);opacity:0;}}
.match-body{padding:24px;}
.match-wow{font-family:'Ma Shan Zheng',cursive;font-size:28px;color:var(--coral);text-align:center;margin-bottom:16px;}
.match-name{font-size:20px;font-weight:700;margin-bottom:12px;}
.match-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.mdet{background:#f8f8f8;border-radius:12px;padding:12px;text-align:center;}
.mdet-val{font-size:18px;font-weight:700;color:var(--coral);margin-bottom:2px;}
.mdet-lbl{font-size:11px;color:var(--muted);}
.match-btns{display:flex;gap:10px;}
.mbtn{flex:1;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.mbtn-p{background:var(--coral);color:#fff;}.mbtn-p:hover{background:#ff5252;}
.mbtn-s{background:#f0f0f0;color:var(--ink);}

/* Empty state */
.swipe-empty{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding-bottom:60px;
}
.swipe-empty .ei{font-size:72px;animation:wobble 2s ease-in-out infinite;}
@keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.swipe-empty h3{font-family:'Ma Shan Zheng',cursive;font-size:28px;color:#fff;}
.swipe-empty p{font-size:14px;color:rgba(255,255,255,.5);}
.reset-btn{padding:12px 28px;border-radius:30px;background:var(--coral);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}

/* ════════════════════════════
   HOT LIST 食堂热搜榜
════════════════════════════ */
#view-hot{background:var(--cream);overflow-y:auto;}
.hot-container{max-width:700px;margin:0 auto;padding:24px 20px 80px;}
.hot-header{
  background:linear-gradient(135deg,#FF4500 0%,#FF8C00 50%,#FFD700 100%);
  border-radius:24px;padding:28px 28px 24px;margin-bottom:24px;
  position:relative;overflow:hidden;
}
.hot-header::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,.1);
}
.hot-header h2{font-family:'Ma Shan Zheng',cursive;font-size:30px;color:#fff;margin-bottom:6px;}
.hot-header p{font-size:13px;color:rgba(255,255,255,.8);}
.hot-update{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.2);color:#fff;
  padding:4px 12px;border-radius:20px;font-size:11px;font-weight:500;margin-top:10px;
}
.live-dot{width:6px;height:6px;background:#fff;border-radius:50%;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* Hot list categories */
.hot-cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;}
.hcat{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;
  border:1.5px solid var(--border);background:#fff;cursor:pointer;
  transition:all .18s;font-family:inherit;white-space:nowrap;flex-shrink:0;}
.hcat.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* Hot list items */
.hot-list{display:flex;flex-direction:column;gap:12px;}
.hot-item{
  background:#fff;border-radius:20px;padding:16px 20px;
  display:flex;align-items:center;gap:16px;cursor:pointer;
  transition:all .2s;border:1.5px solid transparent;
  box-shadow:var(--s0);
}
.hot-item:hover{border-color:var(--coral);transform:translateX(4px);box-shadow:var(--s1);}

/* Rank badges */
.rank{width:36px;flex-shrink:0;text-align:center;}
.rank-num{font-size:20px;font-weight:900;line-height:1;}
.rank-1{color:#FF4500;}
.rank-2{color:#FF8C00;}
.rank-3{color:#FFD700;}
.rank-n{font-size:16px;color:#bbb;}
.rank-arrow{font-size:10px;margin-top:2px;}
.arr-up{color:var(--coral);}
.arr-dn{color:var(--sky);}
.arr-st{color:#bbb;}

.hot-emoji{font-size:36px;flex-shrink:0;}
.hot-info{flex:1;min-width:0;}
.hot-name{font-size:15px;font-weight:700;margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* The special label tags */
.hot-label{
  display:inline-block;
  padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;
  margin-bottom:6px;
}
.hl-fire{background:#FFF0E6;color:#C84B00;}
.hl-magic{background:#F0F0FF;color:#5A00E0;}
.hl-soul{background:#FFF5E0;color:#B06000;}
.hl-hype{background:#FFE8F0;color:#C0005A;}
.hl-hidden{background:#E8FFF0;color:#006B30;}
.hl-cult{background:#E8F5FF;color:#004FA0;}
.hl-vibe{background:#F5F0FF;color:#6000C0;}
.hl-late{background:#1A1A2E;color:#7B9FFF;}

.hot-sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.hot-sub span{display:flex;align-items:center;gap:3px;}
.hot-right{text-align:right;flex-shrink:0;}
.hot-score{font-size:18px;font-weight:900;
  background:linear-gradient(135deg,var(--coral),var(--peach));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hot-heat{font-size:11px;color:var(--muted);}
.trending-bar{width:60px;height:4px;background:#f0f0f0;border-radius:2px;margin-top:4px;overflow:hidden;}
.trending-fill{height:100%;background:linear-gradient(90deg,var(--coral),var(--peach));border-radius:2px;}

/* Topic tags floating section */
.topic-section{margin-bottom:24px;}
.topic-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px;}
.topic-cloud{display:flex;flex-wrap:wrap;gap:8px;}
.topic-tag{
  padding:7px 14px;border-radius:10px;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .18s;border:none;font-family:inherit;
}
.topic-tag:hover{transform:translateY(-2px);box-shadow:var(--s0);}
.tt-1{background:#FFE8D6;color:#C84B00;}
.tt-2{background:#E8F4FF;color:#0052CC;}
.tt-3{background:#EDFFF4;color:#006B30;}
.tt-4{background:#FFF0FB;color:#9B0066;}
.tt-5{background:#FFF9E0;color:#7A5C00;}
.tt-6{background:#EEE8FF;color:#5A00B4;}
.tt-7{background:#FFE8E8;color:#C00000;}
.tt-8{background:#E8FFF8;color:#005E4C;}

/* ════════════════════════════
   HOME — 帮我选
════════════════════════════ */
#view-home{background:var(--cream);overflow-y:auto;}
.home-wrap{padding:24px 20px 80px;max-width:860px;margin:0 auto;}
.hero-head{text-align:center;padding:24px 0 32px;}
.hero-head h1{font-family:'Ma Shan Zheng',cursive;font-size:48px;line-height:1.1;
  background:linear-gradient(135deg,var(--coral) 0%,var(--peach) 50%,var(--yellow) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;}
.hero-head p{font-size:14px;color:var(--muted);}
.card-box{background:#fff;border-radius:24px;padding:24px;box-shadow:var(--s0);margin-bottom:20px;border:1.5px solid rgba(255,107,107,.1);}
.box-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.mood-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
.mood-card{padding:12px 6px;text-align:center;border-radius:14px;cursor:pointer;
  transition:all .2s;border:2px solid transparent;background:#fafafa;}
.mood-card:hover{transform:translateY(-2px);box-shadow:var(--s0);}
.mood-card.sel{border-color:var(--coral);background:#fff5f5;transform:translateY(-2px);}
.mi{font-size:26px;margin-bottom:4px;}.ml{font-size:11px;font-weight:600;}.ms{font-size:10px;color:var(--muted);margin-top:1px;}
.budget-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.blabel{font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;}
.bpills{display:flex;gap:6px;flex-wrap:wrap;}
.bpill{padding:6px 14px;border-radius:18px;font-size:12px;font-weight:500;
  border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:all .18s;font-family:inherit;}
.bpill.active{background:var(--yellow);border-color:var(--yellow);color:var(--ink);}
.big-btn{width:100%;padding:16px;border-radius:14px;border:none;
  font-family:'Ma Shan Zheng',cursive;font-size:20px;cursor:pointer;transition:all .25s;
  background:linear-gradient(135deg,var(--coral) 0%,var(--peach) 100%);color:#fff;letter-spacing:2px;
  box-shadow:0 6px 24px rgba(255,107,107,.4);}
.big-btn:hover{transform:translateY(-2px);}
.spin-ico{animation:spin 2s linear infinite;display:inline-block;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.result-area{margin-bottom:20px;}
.result-card{background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.12);overflow:hidden;border:2px solid var(--yellow);animation:popIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{opacity:0;transform:scale(.85) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);}}
.res-hero{height:160px;display:flex;align-items:center;justify-content:center;font-size:80px;position:relative;}
.winner-b{position:absolute;top:12px;left:12px;background:var(--yellow);color:var(--ink);padding:5px 12px;border-radius:18px;font-size:12px;font-weight:700;}
.res-body{padding:18px 20px 20px;}
.res-name{font-size:22px;font-weight:700;margin-bottom:6px;}
.res-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.rchip{padding:3px 10px;border-radius:18px;font-size:11px;font-weight:600;}
.rc-r{background:#FFF3EF;color:var(--coral);}
.rc-y{background:#FFF8E1;color:#F57F17;}
.rc-g{background:#E8F5E9;color:#2E7D32;}
.rc-b{background:#E3F2FD;color:#1565C0;}
.res-reason{background:linear-gradient(135deg,#FFF9F0,#FFF5F5);border-radius:10px;padding:12px 14px;font-size:12px;color:#555;line-height:1.7;border-left:3px solid var(--coral);margin-bottom:14px;}
.res-btns{display:flex;gap:8px;}
.ra-btn{flex:1;padding:11px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
.ra-p{background:var(--coral);color:#fff;}.ra-b{background:var(--sky);color:#fff;}.ra-s{background:#f0f0f0;color:var(--ink);}
.ldots{display:flex;justify-content:center;gap:8px;padding:20px;}
.ldots span{width:10px;height:10px;border-radius:50%;background:var(--coral);animation:db 1.2s ease-in-out infinite;}
.ldots span:nth-child(2){animation-delay:.2s;background:var(--peach);}
.ldots span:nth-child(3){animation-delay:.4s;background:var(--yellow);}
@keyframes db{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ════════════════════════════
   EXPLORE
════════════════════════════ */
#view-explore{background:var(--cream);overflow-y:auto;}
.expl-sec{max-width:1100px;margin:0 auto;padding:24px 20px 80px;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sec-title{font-family:'Ma Shan Zheng',cursive;font-size:24px;}
.filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.fchip{padding:6px 14px;border-radius:18px;font-size:12px;font-weight:500;
  border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:all .18s;font-family:inherit;white-space:nowrap;}
.fchip.active{border-color:transparent;color:#fff;}
.fc-all.active{background:var(--ink);}
.fc-rice.active{background:var(--coral);}
.fc-noodle.active{background:var(--peach);}
.fc-bbq.active{background:#E65100;}
.fc-hotpot.active{background:#B71C1C;}
.fc-western.active{background:var(--sky);}
.fc-dessert.active{background:var(--lav);}
.fc-snack.active{background:var(--mint);}
.search-row{display:flex;gap:10px;margin-bottom:16px;}
.si-wrap{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:28px;
  padding:9px 18px;border:1.5px solid var(--border);box-shadow:var(--s0);transition:border-color .2s;}
.si-wrap:focus-within{border-color:var(--coral);}
.si-wrap input{flex:1;border:none;outline:none;font-size:14px;font-family:inherit;background:transparent;}
.sort-sel{padding:9px 16px;border-radius:28px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-family:inherit;cursor:pointer;outline:none;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.rcard{background:#fff;border-radius:18px;overflow:hidden;border:1.5px solid var(--border);cursor:pointer;transition:all .22s;}
.rcard:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,.1);border-color:transparent;}

function renderSwipeStack(){
  const stack=document.getElementById('cardStack');

  if(swipeDeck.length===0){

      <button class="reset-btn" onclick="initSwipe()">🔄 再来一轮</button>
    </div>`;
    return;
  }

  const visible=swipeDeck.slice(0,3);
  stack.innerHTML=visible.map((r,i)=>{
    const cls=i===0?'is-top':i===1?'is-second':'is-third';
    return`<div class="food-card ${cls}" id="card-${r.id}" data-id="${r.id}">

        </div>
        <div class="vote-overlay vote-yes"><div class="vote-label">想吃！</div></div>
        <div class="vote-overlay vote-no"><div class="vote-label">Pass</div></div>
      </div>
    </div>`;
  }).join('');

  attachSwipeEvents();
}

function attachSwipeEvents(){
  const card=document.querySelector('.food-card.is-top');
  if(!card)return;
  currentCard=card;

  card.addEventListener('mousedown',dragStart);
  card.addEventListener('touchstart',dragStart,{passive:true});
  document.addEventListener('mousemove',dragMove);
  document.addEventListener('touchmove',dragMove,{passive:true});
  document.addEventListener('mouseup',dragEnd);
  document.addEventListener('touchend',dragEnd);
}

function detachEvents(){
  document.removeEventListener('mousemove',dragMove);
  document.removeEventListener('touchmove',dragMove);
  document.removeEventListener('mouseup',dragEnd);
  document.removeEventListener('touchend',dragEnd);
}

function getX(e){return e.touches?e.touches[0].clientX:e.clientX;}
function getY(e){return e.touches?e.touches[0].clientY:e.clientY;}

function dragStart(e){
  isDragging=true;
  startX=getX(e);startY=getY(e);
  if(currentCard)currentCard.style.transition='none';
}

function dragMove(e){
  if(!isDragging||!currentCard)return;
  const dx=getX(e)-startX;
  const dy=getY(e)-startY;
  const rot=dx*0.12;
  currentCard.style.transform=`translateX(${dx}px) translateY(${dy*.3}px) rotate(${rot}deg)`;
  const pct=Math.min(Math.abs(dx)/120,1);
  const yesOv=currentCard.querySelector('.vote-yes');
  const noOv=currentCard.querySelector('.vote-no');
  if(dx>0){yesOv.style.opacity=pct;noOv.style.opacity=0;}
  else{noOv.style.opacity=pct;yesOv.style.opacity=0;}
}

function dragEnd(e){
  if(!isDragging||!currentCard)return;
  isDragging=false;
  const dx=getX(e)-startX;
  detachEvents();
  if(Math.abs(dx)>80){
    flyOut(dx>0?'right':'left');
  } else {
    currentCard.style.transition='transform .35s cubic-bezier(.34,1.56,.64,1)';
    currentCard.style.transform='';
    currentCard.querySelector('.vote-yes').style.opacity=0;
    currentCard.querySelector('.vote-no').style.opacity=0;
    setTimeout(attachSwipeEvents,350);
  }
}

function flyOut(dir){
  if(!currentCard)return;
  const id=parseInt(currentCard.dataset.id);
  const r=D.find(x=>x.id===id);
  currentCard.style.transition='transform .45s ease, opacity .45s ease';
  const fly=dir==='right'?'translateX(140%) rotate(30deg)':'translateX(-140%) rotate(-30deg)';
  currentCard.style.transform=fly;
  currentCard.style.opacity='0';
  if(dir==='right'){
    swipeHistory.push({r,card:currentCard});
    showMatch(r);
  } else {
    swipeHistory.push({r,card:currentCard});
  }
  swipeDeck=swipeDeck.filter(x=>x.id!==id);
  setTimeout(()=>{renderSwipeStack();},420);
}

function doSwipe(dir){flyOut(dir);}

function undoSwipe(){
  if(swipeHistory.length===0){toast('没有可以撤回的了 😅');return;}
  const last=swipeHistory.pop();
  swipeDeck.unshift(last.r);
  renderSwipeStack();
  toast('↩ 已撤回');
}

function renderHot(){

      `<div class="rank-num rank-n">${rank}</div>`;

    const heatFmt=r.heat>=10000?`${(r.heat/10000).toFixed(1)}万`:`${(r.heat/1000).toFixed(1)}k`;
    return`<div class="hot-item" onclick="od(${r.id})">

          <button class="rbtn rbtn-s" onclick="event.stopPropagation();toast('🗺 导航！')">导航</button>
          <button class="rbtn rbtn-p" onclick="event.stopPropagation();od(${r.id})">详情</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ══════════ FAV ══════════ */
function tf(id,btn,ev){
  ev.stopPropagation();
  if(favs.has(id)){favs.delete(id);btn.textContent='🤍';toast('已取消收藏');}
  else{favs.add(id);btn.textContent='❤️';toast('已加入收藏 ❤️');}
}

/* ══════════ DRAWER ══════════ */
function od(id){
  const r=D.find(x=>x.id===id);
  document.getElementById('drhero').style.background=r.pBg;
  document.getElementById('drhero').innerHTML=`<span style="font-size:88px">${r.e}</span>`;
  document.getElementById('drbody').innerHTML=`
    <div class="drtitle">${r.nm}</div>
    <div class="drchips">
      <span class="drc drc-y">⭐ ${r.r}（${r.rv}评）</span>
      <span class="drc drc-g">${r.pLb}</span>
      <span class="drc drc-b">📍 步行${r.w}分钟</span>
      <span class="drc drc-r">🕐 ${r.hr}</span>
    </div>
    ${r.hd?`<div class="dr-deal">🏷 今日学生专属：${r.dl}（凭学生证）</div>`:''}
    <div class="hot-label ${r.hotLabel.cls}" style="margin-bottom:14px;display:inline-block">${r.hotLabel.text}</div>
    <div class="drsec"><h4>🍽️ 热门菜品</h4>
      ${r.mn.map(m=>`<div class="mrow"><span class="memoji">${m.e}</span><div class="minfo"><div class="mname">${m.n}</div><div class="mdesc">${m.d}</div></div><div class="mprice">${m.p}</div></div>`).join('')}
    </div>
    <div class="drsec"><h4>💬 同学评价</h4>
      ${r.rs.map(rv=>`<div class="rev-item"><div class="rev-head"><div class="rev-av">${rv.nm[0]}</div><div><div class="rev-nm">${rv.nm}</div><div class="rev-sc">${rv.sc}</div></div></div><div class="rev-tx">${rv.tx}</div></div>`).join('')}
    </div>`;
  document.getElementById('overlay').classList.add('open');
}
function cd(e){if(!e||e.target===document.getElementById('overlay'))document.getElementById('overlay').classList.remove('open');}

/* ══════════ TOAST ══════════ */
let tt;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2600);
}

/* ══════════ INIT ══════════ */
initSwipe();
renderHot();
</script>
</body>
</html>
